<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fejlesztőink</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #eef4fb;
    }

    h1 {
      text-align: center;
      color: #1d3557;
      margin-bottom: 30px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      justify-items: center;
    }

    .card {
      width: 250px;
      height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #ffffff;
      border: 2px solid #4a90e2;
      border-radius: 16px;
      box-shadow: 0 5px 12px rgba(74,144,226,0.4);
    }

    .card img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
    }

    .name {
      font-weight: bold;
      font-size: 1.2em;
      margin-top: 10px;
      color: #1d3557;
    }

    .title {
      margin-top: 5px;
      color: #457b9d;
    }

    .email {
      margin-top: 5px;
      font-size: 0.9em;
      color: #e63946;
    }
  </style>
</head>
<body>
  <h1>Fejlesztőink</h1>
  <div class="grid-container">
    <div class="card">
      <img src="images/fejleszto1.jpeg" alt="Barta Norbert">
      <div class="name">Barta Norbert</div>
      <div class="title">Játéktervező</div>
      <div class="email">norbert@pixelmuhely.hu</div>
    </div>
    <div class="card">
      <img src="images/fejleszto2.jpeg" alt="Lakatos Vera">
      <div class="name">Lakatos Vera</div>
      <div class="title">Grafikus</div>
      <div class="email">vera@pixelmuhely.hu</div>
    </div>
    <div class="card">
      <img src="images/fejleszto3.jpeg" alt="Simon Ákos">
      <div class="name">Simon Ákos</div>
      <div class="title">Programozó</div>
      <div class="email">akos@pixelmuhely.hu</div>
    </div>
  </div>
</body>
</html>
