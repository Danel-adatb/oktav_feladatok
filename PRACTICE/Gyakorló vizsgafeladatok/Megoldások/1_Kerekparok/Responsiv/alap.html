<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Csapatunk</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .card {
      width: 300px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }

    .name {
      font-weight: bold;
      font-size: 1.2em;
      margin-top: 10px;
    }

    .title {
      color: #555;
      margin-top: 5px;
    }

    .email {
      color: #3a6ea5;
      font-size: 0.9em;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>Csapatunk</h1>
  <div class="grid-container">
    <div class="card">
      <img src="images/manager.jpeg" alt="Tóth Bence">
      <div class="name">Tóth Bence</div>
      <div class="title">Üzletvezető</div>
      <div class="email">bence@kerekparkiraly.hu</div>
    </div>
    <div class="card">
      <img src="images/sales.jpeg" alt="Varga Réka">
      <div class="name">Varga Réka</div>
      <div class="title">Értékesítő</div>
      <div class="email">reka@kerekparkiraly.hu</div>
    </div>
    <div class="card">
      <img src="images/workshop.jpeg" alt="Molnár Dávid">
      <div class="name">Molnár Dávid</div>
      <div class="title">Szerelő</div>
      <div class="email">david@kerekparkiraly.hu</div>
    </div>
  </div>
</body>
</html>
