<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmjeink</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #101820;
    }

    h1 {
      text-align: center;
      color: #f2f2f2;
      margin-bottom: 30px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      justify-items: center;
    }

    .card {
      width: 320px;
      height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #ffffff;
      border: 2px solid #ddd;
      border-radius: 20px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    .card img {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
    }

    .name {
      font-weight: bold;
      font-size: 1.2em;
      margin-top: 10px;
      color: #222;
    }

    .title {
      margin-top: 5px;
      color: #555;
    }

    .email {
      margin-top: 5px;
      font-size: 0.9em;
      color: #c0392b;
    }
  </style>
</head>
<body>
  <h1>Filmjeink</h1>
  <div class="grid-container">
    <div class="card">
      <img src="images/poster1.jpeg" alt="A csillagok alatt">
      <div class="name">Az utolsó szerelő</div>
      <div class="title">Rendező: Kovács Márk</div>
      <div class="email">Vígjáték, 2021</div>
    </div>
    <div class="card">
      <img src="images/poster2.jpeg" alt="Kék horizont">
      <div class="name">Éjféli expressz</div>
      <div class="title">Rendező: Szabó Lilla</div>
      <div class="email">Akció, 2022</div>
    </div>
    <div class="card">
      <img src="images/poster3.jpeg" alt="Éjféli expressz">
      <div class="name">Csillagkikötő</div>
      <div class="title">Rendező: Farkas Ádám</div>
      <div class="email">Sci-fi, 2023</div>
    </div>
  </div>
</body>
</html>
