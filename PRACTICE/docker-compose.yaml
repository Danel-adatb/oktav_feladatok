services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

  # PHP + Apache szerver a backend-frontend mappa kiszolgálásához.
  php:
    build:
      context: ./backend-frontend
    container_name: php
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8000:80"
    volumes:
      # A mappa élőben be van csatolva: szerkesztés után nem kell újraépíteni.
      - ./backend-frontend:/var/www/html

volumes:
  mysql_data: