<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Csapatunk</title>
  <style>
    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
    }

    h1 {
      text-align: center;
    }

    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        justify-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 300px;
      height: 400px;
      border-radius: 5%;
      border: 1px solid #ccc;
      box-shadow: 1px 1px 1px 1px #e7e7e7;
    }

    .card img {
      width: 280px;
      height: 280px;
      border-radius: 1%;
    }

    .name {
      font-size: larger;
      font-weight: bold;
      margin-bottom: 5px;
      margin-top: 5px;
    }

    .title {
      color: #797878;
      margin-bottom: 5px;
      margin-top: 5px;
    }

    .email {
      font-size: smaller;
      color: blue;
    }
  </style>
</head>
<body>
  <h1>Csapatunk</h1>
  <div class="grid-container">
    <div class="card">
      <img src="images/manager.jpeg" alt="Tóth Bence">
      <div class="name">Tóth Bence</div>
      <div class="title">Üzletvezető</div>
      <div class="email">bence@kerekparkiraly.hu</div>
    </div>
    <div class="card">
      <img src="images/sales.jpeg" alt="Varga Réka">
      <div class="name">Varga Réka</div>
      <div class="title">Értékesítő</div>
      <div class="email">reka@kerekparkiraly.hu</div>
    </div>
    <div class="card">
      <img src="images/workshop.jpeg" alt="Molnár Dávid">
      <div class="name">Molnár Dávid</div>
      <div class="title">Szerelő</div>
      <div class="email">david@kerekparkiraly.hu</div>
    </div>
  </div>
</body>
</html>
