<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmjeink</title>
  <style>
    body {
      background-color: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      text-align: center;
      color: white;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .card {
      background-color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      
      width: 320px;
      height: 440px;
      border-radius: 2%;
      border: 2px solid #ddd;
      box-shadow: 2px 2px 2px 2px rgb(209, 208, 208);
    }

    img {
      margin-top: 10px;
      width: 300px;
      height: 300px;
      border-radius: 2%;
    }

    .name {
      font-weight: bold;
      font-size: large;
      margin: 5px 0 5px 0;
    }

    .title {
      color: grey;
      margin: 0 0 5px 0;
    }

    .email {
      color: red;
      margin: 5px 0 5px 0;
    }
  </style>
</head>
<body>
  <h1>Filmjeink</h1>
  <div class="grid-container">
    <div class="card">
      <img src="images/poster1.jpeg" alt="A csillagok alatt">
      <div class="name">Az utolsó szerelő</div>
      <div class="title">Rendező: Kovács Márk</div>
      <div class="email">Vígjáték, 2021</div>
    </div>
    <div class="card">
      <img src="images/poster2.jpeg" alt="Kék horizont">
      <div class="name">Éjféli expressz</div>
      <div class="title">Rendező: Szabó Lilla</div>
      <div class="email">Akció, 2022</div>
    </div>
    <div class="card">
      <img src="images/poster3.jpeg" alt="Éjféli expressz">
      <div class="name">Csillagkikötő</div>
      <div class="title">Rendező: Farkas Ádám</div>
      <div class="email">Sci-fi, 2023</div>
    </div>
  </div>
</body>
</html>
